name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Install packages
        run: npm install

      - name: Add the AI noise model
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock @shiguredo/rnnoise-wasm@2025.1.5
          node scripts/vendor-rnnoise.mjs

      - name: Add Android project
        run: npx cap add android

      - name: Set AdMob app id
        run: node scripts/prepare-android.mjs

      - name: Copy web app into Android
        run: npx cap sync android

      - name: Build debug APK (3 koshish)
        working-directory: android
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon -I ../ci/mirror.init.gradle && exit 0
            echo "Koshish $i fail hui, 40 second ruk kar dobara..."
            sleep 40
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShuddhVox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
